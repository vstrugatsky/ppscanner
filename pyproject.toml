[project]
name = "premarket"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "aeventkit==2.1.0",
    "certifi==2026.7.22",
    "cffi==2.1.0",
    "charset-normalizer==3.4.9",
    "cryptography==49.0.0",
    "eventkit==1.0.3",
    "fastapi>=0.110.0",
    "google-api-core==2.33.0",
    "google-api-python-client==2.198.0",
    "google-auth==2.56.2",
    "google-auth-httplib2==0.4.0",
    "google-auth-oauthlib==1.4.0",
    "googleapis-common-protos==1.75.0",
    "httplib2==0.32.0",
    "ib-async==2.1.0",
    "idna==3.18",
    "jinja2>=3.1.3",
    "nest-asyncio==1.6.0",
    "numpy==2.5.1",
    "oauthlib==3.3.1",
    "proto-plus==1.28.2",
    "protobuf==7.35.1",
    "pyasn1==0.6.4",
    "pyasn1-modules==0.4.2",
    "pycparser==3.0",
    "pyparsing==3.3.2",
    "python-dotenv==1.2.2",
    "requests==2.34.2",
    "requests-oauthlib==2.0.0",
    "tzdata==2025.3",
    "uritemplate==4.2.0",
    "urllib3==2.7.0",
    "uvicorn>=0.28.0",
]

[dependency-groups]
dev = [
    "ruff>=0.16.1",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
# Select default rules: Pyflakes (F), pycodestyle (E, W), isort (I), pyupgrade (UP), bugbear (B)
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"] # Handled by the formatter